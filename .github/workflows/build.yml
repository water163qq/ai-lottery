name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.0.2"

jobs:
  web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync web assets for Android
        run: python3 scripts/sync-web-assets.py

      - name: Verify generated assets are committed
        run: |
          if [ -n "$(git status --porcelain android/app/src/main/assets/www)" ]; then
            echo "::error::Android web assets are out of sync. Run 'python3 scripts/sync-web-assets.py' and commit the result."
            git --no-pager diff --stat android/app/src/main/assets/www
            exit 1
          fi

      - name: Package web source
        run: |
          mkdir -p dist
          cd lottery-ai
          zip -r ../dist/ai-lottery-web-${{ github.ref_name }}.zip . -x 'downloads/*'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/*.zip
          retention-days: 30

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync web assets
        run: python3 scripts/sync-web-assets.py

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "Signing keystore restored"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set, building with debug signing"
          fi

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.0-dev"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${NAME%%-*}"
          CODE=$(( ${MAJOR:-1} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $NAME (code $CODE)"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced"
            exit 1
          fi
          cp "$APK" "dist/ai-lottery-android-${{ steps.version.outputs.name }}.apk"
          ls -lh dist/

      - name: Verify signing
        run: |
          APK=$(find dist -name '*.apk' | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" || echo "::warning::APK is not signed with a release key"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

  release:
    name: Attach web bundle to release
    needs: [web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
