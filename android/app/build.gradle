apply plugin: 'com.android.application'

def versionNameOverride = project.findProperty("versionName") ?: System.getenv("APP_VERSION_NAME") ?: "1.0.0"
def versionCodeOverride = (project.findProperty("versionCode") ?: System.getenv("APP_VERSION_CODE") ?: "10000").toInteger()

android {
    namespace 'com.monkeycode.ailottery'
    compileSdk 33

    defaultConfig {
        applicationId "com.monkeycode.ailottery"
        minSdk 21
        targetSdk 33
        versionCode versionCodeOverride
        versionName versionNameOverride
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd')}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ksFile = file("keystore.jks")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "lottery2026"
                keyAlias System.getenv("KEY_ALIAS") ?: "ailottery"
                keyPassword System.getenv("KEY_PASSWORD") ?: "lottery2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
